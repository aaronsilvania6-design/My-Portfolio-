<style>

rotate(6deg)}
.section{padding:75px 0}.sectionTop{display:flex;justify-content:space-between;align-items:end;gap:25px;margin-bottom:28px}.eyebrow{font:500 .75rem 'DM Mono';text-transform:uppercase;letter-spacing:.1em;color:#6b7380;margin-bottom:8px}.section h2{font:700 clamp(2rem,4.6vw,3.4rem)/1.08 'Space Grotesk';letter-spacing:-.055em;margin-bottom:0}.sectionDesc{max-width:430px;color:var(--muted);margin-bottom:0}.aboutGrid{display:grid;grid-template-columns:1.15fr .85fr;gap:17px}.card{background:var(--white);border:1.5px solid var(--line);border-radius:19px;padding:25px;box-shadow:4px 5px 0 #20242c08}.card p{color:var(--muted);margin-bottom:0}.card h3{font:700 1.2rem 'Space Grotesk';margin-bottom:10px}.quote{font:600 1.45rem/1.45 'Space Grotesk';letter-spacing:-.03em}.quote span{background:var(--yellow);padding:0 3px}.interestList{display:grid;gap:10px;margin-top:18px}.interest{display:flex;gap:12px;align-items:flex-start}.emoji{width:34px;height:34px;flex:0 0 34px;display:grid;place-items:center;border-radius:10px;background:var(--blue)}.interest:nth-child(2) .emoji{background:var(--yellow)}.interest:nth-child(3) .emoji{background:var(--green)}.interest b{display:block}.interest small{color:var(--muted)}

.projects{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.project{background:var(--white);border:1.5px solid var(--line);border-radius:19px;padding:24px;transition:.2s}.projectTop{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:18px}.projectIcon{display:grid;place-items:center;width:47px;height:47px;border-radius:14px;background:var(--blue);font-size:1.4rem}.project:nth-child(2) .projectIcon{background:var(--yellow)}.project:nth-child(3) .projectIcon{background:var(--green)}.project:nth-child(4) .projectIcon{background:#ffd2c4}.project h3{font:700 1.25rem 'Space Grotesk';margin-bottom:8px}.project p{color:var(--muted);font-size:.94rem}.project .pill{margin:0 5px 5px 0}.status{font:500 .68rem 'DM Mono';color:#59616d;border:1px solid var(--line);padding:5px 8px;border-radius:8px}

@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}

/* Playful floating code: colorful, moving, but kept behind the content */
body{position:relative;isolation:isolate}
.code-cloud{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:-1;opacity:.7}
.code-float{position:absolute;display:block;white-space:nowrap;font:500 .82rem 'DM Mono',monospace;letter-spacing:.02em;color:var(--code-color);opacity:.72;text-shadow:0 2px 14px #fff8ed;animation:codeDrift var(--speed,22s) ease-in-out infinite alternate,codeHue 8s linear infinite}
.code-float:nth-child(1){top:17%;left:2%;--code-color:#ff865e;--speed:18s;animation-delay:-4s}
.code-float:nth-child(2){top:37%;right:2%;--code-color:#5b8ee8;--speed:23s;animation-delay:-9s}
.code-float:nth-child(3){top:65%;left:4%;--code-color:#7caa63;--speed:20s;animation-delay:-12s}
.code-float:nth-child(4){top:81%;right:5%;--code-color:#b078dc;--speed:25s;animation-delay:-6s}
.code-float:nth-child(5){top:52%;left:47%;--code-color:#e5a62d;--speed:17s;animation-delay:-8s}
.code-float:nth-child(6){top:8%;right:17%;--code-color:#27a9a1;--speed:21s;animation-delay:-2s}
@keyframes codeDrift{0%{transform:translate3d(-8px,8px,0) rotate(-4deg)}50%{transform:translate3d(24px,-18px,0) rotate(3deg)}100%{transform:translate3d(-10px,14px,0) rotate(-2deg)}}
@keyframes codeHue{0%{filter:hue-rotate(0deg)}100%{filter:hue-rotate(360deg)}}
.code-badge{position:absolute;z-index:3;padding:9px 12px;border:1px solid #ffffffcc;border-radius:12px;background:#fffdf0e8;box-shadow:0 8px 25px #20242c12;font:500 .78rem 'DM Mono',monospace;backdrop-filter:blur(8px);animation:badgeBob 4s ease-in-out infinite,colorPulse 7s linear infinite}
.code-badge b{font-weight:500;color:#ed7655}.code-badge.a{top:8%;right:0;transform:rotate(5deg)}.code-badge.b{bottom:4%;left:0;transform:rotate(-5deg);animation-delay:-1.8s}
@keyframes badgeBob{0%,100%{translate:0 0}50%{translate:0 -11px}}
@keyframes colorPulse{0%,100%{border-color:#ff865e;background-color:#fff8edee}33%{border-color:#8db9f5;background-color:#f1f7ffed}66%{border-color:#a7ce94;background-color:#f5fff0ed}}
.brandmark{animation:markWiggle 5s ease-in-out infinite}
@keyframes markWiggle{0%,90%,100%{transform:rotate(-5deg)}94%{transform:rotate(7deg) scale(1.08)}97%{transform:rotate(-9deg)}}
.label{animation:labelColor 9s linear infinite}
@keyframes labelColor{0%,100%{background:var(--yellow)}33%{background:var(--green)}66%{background:var(--blue)}}
.highlight:after{animation:highlightColor 10s linear infinite}
@keyframes highlightColor{0%,100%{background:var(--blue)}33%{background:var(--yellow)}66%{background:var(--green)}}
.skill,.project,.card{transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
.skill:hover,.project:hover,.card:hover{transform:translateY(-5px) rotate(-.3deg);box-shadow:7px 9px 0 #20242c12;border-color:#c5d8ee}
@media(max-width:780px){.code-float:nth-child(5){display:none}.code-float{font-size:.68rem;opacity:.48}.code-badge.a{right:-4px}.code-badge.b{left:-3px}}
@media(max-width:540px){.code-cloud{opacity:.48}.code-float:nth-child(2),.code-float:nth-child(4){display:none}.code-badge{font-size:.68rem;padding:7px 9px}.code-badge.a{top:5%;right:1%}.code-badge.b{bottom:2%;left:0}}
@media(prefers-reduced-motion:reduce){.code-float,.code-badge,.brandmark,.label,.highlight:after{
